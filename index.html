<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Tide — Fishing Simulator</title>
<style>
:root{--bg:#0b1820;--panel:#12242d;--panel2:#183039;--line:#24414c;--txt:#e7f1f4;--mut:#8fa9b3;--acc:#3fc1c9;--gold:#f2c14e;--red:#e5534b;--grn:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#173442,#081218 70%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#wrap{max-width:1000px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:22px;margin:0;letter-spacing:.5px}h1 span{color:var(--acc)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.money{color:var(--gold);font-weight:700}
#stage{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid var(--line)}
#popFish{border-radius:10px;display:block;margin:0 auto 6px}
canvas#c{display:block;width:100%;height:auto;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
#toast{position:absolute;top:62px;z-index:5;left:50%;transform:translateX(-50%);background:rgba(8,20,26,.88);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.overlay{position:absolute;inset:0;background:rgba(3,10,14,.6);display:flex;align-items:center;justify-content:center}
.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;width:min(380px,92%);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h2{margin:4px 0 2px;font-size:22px}
.card .info{color:var(--mut);font-size:14px;line-height:1.5}
.card .val{font-size:20px;color:var(--gold);font-weight:700;margin:6px 0}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);margin:2px}
.tag.leg{background:#5a3d0a;color:#ffd77a}.tag.rec{background:#0e4d3a;color:#7ff0c0}.tag.q2{background:#4a2a5e;color:#e3b8ff}.tag.q1{background:#203f5e;color:#a8d4ff}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:9px;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.25)}button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button.pri{background:var(--acc);color:#04222a;border-color:transparent;font-weight:700}
button.gold{background:var(--gold);color:#2a1d00;border-color:transparent;font-weight:700}
button.sm{padding:4px 9px;font-size:13px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
#castBtn{font-size:17px;padding:11px 22px;min-width:170px}
.zones{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.zones button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav button{border-radius:9px 9px 0 0;border-bottom:none;background:transparent;color:var(--mut)}
nav button.on{background:var(--panel);color:var(--txt)}
.panel{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:12px;min-height:220px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid rgba(36,65,76,.5)}
tr.locked td{opacity:.4}
.up{color:var(--grn)}.down{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.item h4{margin:0 0 4px;font-size:15px}.item p{margin:0 0 8px;color:var(--mut);font-size:13px;line-height:1.4}
.item.own{border-color:var(--acc)}
h3{margin:4px 0 10px;font-size:15px;color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.muted{color:var(--mut);font-size:13px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dex div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px}
.dex b{display:block;font-size:14px;margin-bottom:2px}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{white-space:nowrap;flex:0 0 auto}
#castBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media(max-width:600px){#wrap{padding:8px}h1{font-size:19px}.pill{font-size:12px;padding:4px 8px}.controls .muted{display:none}#castBtn{flex:1}
 .zones{margin-left:0;width:100%}nav button{padding:7px 9px;font-size:13px}.panel{padding:8px}table{font-size:12.5px}td,th{padding:5px 3px}
 td:nth-child(5) svg{width:56px}.grid{grid-template-columns:1fr}.card{padding:12px}.card h2{font-size:19px}}
.floater{position:absolute;transform:translateX(-50%);color:var(--gold);font-weight:800;font-size:18px;pointer-events:none;animation:fl 1.3s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.7);z-index:50}
@keyframes fl{to{transform:translate(-50%,-55px);opacity:0}}
footer{color:var(--mut);font-size:12px;text-align:center;margin:14px 0 4px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>🎣 Deep <span>Tide</span></h1>
    <div class="stats">
      <div class="pill money" id="hMoney">$0</div>
      <div class="pill" id="hLvl"></div>
      <div class="pill" id="hWx"></div>
      <div class="pill" id="hRod"></div>
      <div class="pill" id="hBait"></div>
      <div class="pill" id="hBoat"></div>
      <div class="pill" id="hBox"></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="c" width="960" height="540"></canvas>
    <div id="toast"></div>
    <div id="pop" class="overlay hidden">
      <div class="card">
        <canvas id="popFish" width="600" height="240" style="width:100%;max-width:300px"></canvas>
        <div id="popTags"></div>
        <h2 id="popName"></h2>
        <div class="info" id="popInfo"></div>
        <div class="val" id="popVal"></div>
        <div class="btns">
          <button class="pri" id="bKeep">Keep in Fish Box</button>
          <button class="gold" id="bSell">Sell now</button>
          <button id="bMount">🏆 Mount trophy</button>
        </div>
        <div class="muted" style="margin-top:8px">Kept fish can be sold later, when the price is higher.</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="pri" id="castBtn">Hold to Cast</button>
    <span class="muted">or hold <b>Space</b> / tap the water</span>
    <button class="sm" id="mute" title="Sound on/off">🔊</button>
    <div class="zones" id="zones"></div>
  </div>

  <nav id="tabs">
    <button data-t="market" class="on">📈 Market</button>
    <button data-t="box">🧊 Fish Box</button>
    <button data-t="orders">📜 Orders &amp; Derby</button>
    <button data-t="shop">🛒 Tackle Shop</button>
    <button data-t="dex">🏆 Trophies</button>
  </nav>
  <div class="panel" id="panel"></div>
  <footer>Progress saves automatically in this browser. · <a href="#" id="reset" style="color:var(--mut)">Reset game</a></footer>
</div>

<script>
// ======================= DATA =======================
const SPECIES=[
 {id:'bluegill',name:'Bluegill',zone:0,min:.1,max:.7,price:8,rar:30,col:'#5f86a8'},
 {id:'perch',name:'Yellow Perch',zone:0,min:.2,max:1.2,price:12,rar:24,col:'#c9a33a'},
 {id:'carp',name:'Common Carp',zone:0,min:1,max:9,price:6,rar:16,col:'#9a7a44'},
 {id:'catfish',name:'Channel Catfish',zone:0,min:1,max:12,price:9,rar:9,col:'#6d6b5c'},
 {id:'koi',name:'Golden Koi',zone:0,min:.8,max:5,price:80,rar:1.2,col:'#f0a630'},
 {id:'bass',name:'Largemouth Bass',zone:1,min:.5,max:5,price:14,rar:26,col:'#5d7a3a'},
 {id:'trout',name:'Rainbow Trout',zone:1,min:.4,max:4.5,price:18,rar:18,col:'#9db4a8'},
 {id:'walleye',name:'Walleye',zone:1,min:.6,max:6,price:16,rar:16,col:'#a8934e'},
 {id:'pike',name:'Northern Pike',zone:1,min:1,max:13,price:12,rar:11,col:'#6f8a4f'},
 {id:'muskie',name:'Tiger Muskie',zone:1,min:4,max:26,price:28,rar:2.5,col:'#b6a76a'},
 {id:'mackerel',name:'Atlantic Mackerel',zone:2,min:.3,max:2,price:12,rar:28,col:'#3c7a8a'},
 {id:'seabass',name:'European Sea Bass',zone:2,min:1,max:8,price:18,rar:18,col:'#8c9aa3'},
 {id:'cod',name:'Atlantic Cod',zone:2,min:1,max:22,price:11,rar:16,col:'#8a8060'},
 {id:'salmon',name:'King Salmon',zone:2,min:2,max:20,price:20,rar:11,col:'#a7a9b0'},
 {id:'halibut',name:'Giant Halibut',zone:2,min:30,max:150,price:18,rar:2.2,col:'#6e5a45'},
 {id:'mahi',name:'Mahi-Mahi',zone:3,min:3,max:25,price:18,rar:24,col:'#3fae6a'},
 {id:'grouper',name:'Goliath Grouper',zone:3,min:5,max:70,price:14,rar:16,col:'#7a6a4a'},
 {id:'yellowfin',name:'Yellowfin Tuna',zone:3,min:10,max:90,price:22,rar:14,col:'#3a5a8a'},
 {id:'swordfish',name:'Swordfish',zone:3,min:30,max:200,price:24,rar:6,col:'#4c5a70'},
 {id:'marlin',name:'Blue Marlin',zone:3,min:60,max:350,price:26,rar:2.5,col:'#2d5da8'},
 {id:'bluefin',name:'Bluefin Tuna',zone:3,min:80,max:420,price:32,rar:1.6,col:'#24406e'}
];
const ZONES=[
 {name:'Old Dock',water:['#4e7f6a','#10302a'],bed:'#3b3a2a',hills:'#2e4a3a',amp:1,sky:1},
 {name:'Pine Lake',water:['#3a7f98','#0a283a'],bed:'#4a4332',hills:'#2a4637',amp:1.4,sky:1},
 {name:'Rocky Coast',water:['#2a80a9','#05223b'],bed:'#6b6250',hills:'#4a4e57',amp:2.3,sky:1},
 {name:'Open Ocean',water:['#1464aa','#020b24'],bed:'#1d2a3a',hills:null,amp:3.4,sky:1}
];
const RODS=[
 {name:'Bamboo Pole',price:0,power:5,reel:1,col:'#c9a35a',desc:'Fine for panfish.'},
 {name:'Fiberglass Rod',price:150,power:12,reel:1.15,col:'#3d6fb0',desc:'Handles carp and bass.'},
 {name:'Graphite Spinner',price:700,power:30,reel:1.35,col:'#2b2b2b',desc:'Light and sensitive.'},
 {name:'Carbon Pro Caster',price:2800,power:85,reel:1.6,col:'#b0302a',desc:'Coastal heavyweights.'},
 {name:'Big Game Trolling Rod',price:9500,power:220,reel:1.9,col:'#d9d9d9',desc:'Built for tuna.'},
 {name:'Abyss Master',price:32000,power:480,reel:2.3,col:'#7a3cff',desc:'Lands anything that swims.'}
];
const BAIT=[
 {name:'Worms',price:0,bite:1,luck:0,big:0,desc:'Free and endless.'},
 {name:'Crickets',price:25,bite:.8,luck:.12,big:.05,desc:'Faster bites.'},
 {name:'Live Minnows',price:80,bite:.7,luck:.3,big:.2,desc:'Attracts bigger fish.'},
 {name:'Squid Strips',price:200,bite:.6,luck:.5,big:.35,desc:'Rare-fish magnet.'},
 {name:'Live Mackerel',price:500,bite:.5,luck:.85,big:.55,desc:'For trophy hunters.'}
];
const BOATS=[
 {name:'No boat (dock)',price:0,cap:8,desc:'Fish from the old dock.'},
 {name:'Rowboat',price:400,cap:15,desc:'Unlocks Pine Lake.'},
 {name:'Bass Boat',price:3200,cap:30,desc:'Unlocks Rocky Coast.'},
 {name:'Sport Fisher',price:16000,cap:60,desc:'Unlocks the Open Ocean.'}
];
const QUAL=[{n:'Normal',m:1},{n:'Fine ★',m:1.3},{n:'Perfect ★★',m:2}];
const SP={};SPECIES.forEach(s=>SP[s.id]=s);

// ======================= STATE =======================
const KEY='deeptide_save_v1';
let S={money:50,rod:0,ownedRods:[0],boat:0,zone:0,bait:0,baitQty:[0,0,0,0,0],box:[],trophies:[],dex:{},xp:0,lvl:1,orders:[],ach:{},up:{cooler:0,finder:0,charm:0},stats:{}};
let resetting=false;
function save(){if(resetting)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d.money==='number')S=Object.assign(S,d)}catch(e){}}
load();S.box=(S.box||[]).filter(f=>f&&SP[f.id]);S.trophies=(S.trophies||[]).filter(f=>f&&SP[f.id]);

const M={};SPECIES.forEach(s=>M[s.id]={m:rand(.85,1.15),h:[]});
SPECIES.forEach(s=>{for(let i=0;i<40;i++)M[s.id].h.push(M[s.id].m)});

// ======================= UTIL =======================
function rand(a,b){return a+Math.random()*(b-a)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>'$'+Math.round(n).toLocaleString();
const $=s=>document.querySelector(s);
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*1.2}
function hex(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function shade(c,amt){return'#'+hex(c).map(v=>clamp(v+amt,0,255).toString(16).padStart(2,'0')).join('')}
function rgba(c,a){const[r,g,b]=hex(c);return`rgba(${r},${g},${b},${a})`}
const priceKg=id=>SP[id].price*M[id].m;
const fishValue=f=>f.w*priceKg(f.id)*QUAL[f.q].m*(1+(S.lvl-1)*.02);
const cap=()=>BOATS[S.boat].cap+((S.up&&S.up.cooler)||0)*5;
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}

// ======================= CANVAS / SCENE =======================
const cv=$('#c'),ctx=cv.getContext('2d');const W=960,H=540,SEA=250,AH=SEA+14;
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w*DPR;c.height=h*DPR;return c}
const above=mkCanvas(W,AH),actx=above.getContext('2d');
const fg=mkCanvas(W,H),fctx=fg.getContext('2d');
let time=0,dayT=0.42;

// ---- fish looks ----
const LOOK={
 bluegill:{h:.55,back:'#2c4658',belly:'#e8a050',pat:'bars',n:6,fin:'#3a5468',tail:.15},
 perch:{h:.33,back:'#4a5a2a',belly:'#f0e6c0',pat:'bars',n:6,fin:'#e07a2a',spiny:1,tail:.2},
 carp:{h:.38,back:'#5a4a28',belly:'#e8d8a0',pat:'none',fin:'#9a6a3a',tail:.25,whisk:1},
 catfish:{h:.26,back:'#3e3e38',belly:'#d8d8cc',pat:'spots',spot:'#2a2a24',fin:'#55554a',whisk:3,tail:.1},
 koi:{h:.32,back:'#e8901a',belly:'#fff4e0',pat:'koi',fin:'#f8e8d0',tail:.25,whisk:1},
 bass:{h:.36,back:'#2f4a22',belly:'#e8e8c8',pat:'stripe',stripe:'#24361a',fin:'#4a6a3a',spiny:1,tail:.12},
 trout:{h:.3,back:'#4a5a48',belly:'#f4f0ea',pat:'trout',stripe:'#e0708a',spot:'#2a2a2a',fin:'#8aa098',tail:.12},
 walleye:{h:.3,back:'#5a5228',belly:'#f0ecd8',pat:'bars',n:5,soft:1,fin:'#a8934e',spiny:1,eye:1.6,tail:.18},
 pike:{h:.22,back:'#3e5a2a',belly:'#eef0d8',pat:'spots',spot:'#d8e0a0',fin:'#8a7a3a',bd:1,tail:.18},
 muskie:{h:.24,back:'#6a6a3a',belly:'#f0eccc',pat:'bars',n:9,fin:'#9a7a4a',bd:1,tail:.2},
 mackerel:{h:.26,back:'#1e5a6a',belly:'#eef4f6',pat:'wavy',fin:'#5a7a8a',tail:.38,finlets:'#5a7a8a'},
 seabass:{h:.32,back:'#4a5a66',belly:'#f2f4f6',pat:'none',fin:'#7a8a94',spiny:1,tail:.18},
 cod:{h:.3,back:'#6a6040',belly:'#f0ecdc',pat:'spots',spot:'#4a4028',fin:'#7a7050',whisk:1,tail:.08},
 salmon:{h:.3,back:'#3a4a5a',belly:'#f6f6f8',pat:'spots',spot:'#1a2a3a',spotTop:1,fin:'#6a7480',tail:.2},
 halibut:{h:.46,back:'#4a3a2a',belly:'#d8ccb8',pat:'mottle',fin:'#5a4a38',tail:.15},
 mahi:{h:.36,back:'#1a7a8a',belly:'#f0d830',pat:'spots',spot:'#2a6aa8',fin:'#2a8a9a',long:1,tail:.4},
 grouper:{h:.4,back:'#4a4028',belly:'#c8b890',pat:'mottle',fin:'#5a4a30',spiny:1,tail:.06},
 yellowfin:{h:.3,back:'#14284a',belly:'#eef2f6',pat:'stripe',stripe:'#e8c830',fin:'#e8c830',finlets:'#f0d020',tail:.45},
 swordfish:{h:.22,back:'#2a3442',belly:'#d0d6dc',pat:'none',fin:'#3a4452',bill:.55,tail:.45},
 marlin:{h:.24,back:'#12305e',belly:'#e8eef4',pat:'bars',n:10,barCol:'rgba(140,200,255,.35)',fin:'#1a3a70',bill:.4,sail:1,tail:.5},
 bluefin:{h:.32,back:'#0e1e3a',belly:'#e8ecf2',pat:'none',fin:'#2a3a5a',finlets:'#e8c830',tail:.45}
};
function hashStr(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%2147483647;return h||1}

function drawFish(c,x,y,L,col,dir,ph,a=1,dark=false,id=null){
 const lk=(id&&LOOK[id])||{h:.34,back:shade(col,-45),belly:shade(col,70),pat:'none',fin:shade(col,-20),tail:.2};
 const h=L*lk.h,wag=Math.sin(ph)*.22,D='#06141a',finC=dark?D:lk.fin;
 c.save();c.translate(x,y);c.scale(dir,1);c.globalAlpha=a;
 // tail
 c.save();c.translate(-L*.41,0);c.rotate(wag);c.fillStyle=finC;c.beginPath();
 const tl=L*.22,th=h*.75+L*.05,fk=lk.tail;
 c.moveTo(2,-h*.08);c.quadraticCurveTo(-tl*.4,-th*.4,-tl,-th);c.quadraticCurveTo(-tl*(1-fk),0,-tl,th);c.quadraticCurveTo(-tl*.4,th*.4,2,h*.08);c.closePath();c.fill();
 if(!dark&&L>30){c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=.6;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(0,0);c.lineTo(-tl*.85,th*.38*i);c.stroke()}}
 c.restore();
 // dorsal fin
 c.fillStyle=finC;c.beginPath();
 if(lk.sail){c.moveTo(L*.22,-h*.42);c.quadraticCurveTo(L*.1,-h*1.9,-L*.05,-h*1.2);c.lineTo(-L*.12,-h*.4)}
 else if(lk.long){c.moveTo(L*.36,-h*.42);c.quadraticCurveTo(L*.1,-h*.95,-L*.36,-h*.25);c.lineTo(-L*.34,-h*.12)}
 else if(lk.bd){c.moveTo(-L*.15,-h*.4);c.quadraticCurveTo(-L*.25,-h*.95,-L*.36,-h*.2)}
 else if(lk.spiny){c.moveTo(L*.18,-h*.45);for(let i=0;i<=8;i++)c.lineTo(L*.18-i*L*.045,-h*(.9-i*.04)*(i%2?.82:1));c.lineTo(-L*.22,-h*.38)}
 else{c.moveTo(L*.12,-h*.47);c.quadraticCurveTo(0,-h*1.0,-L*.14,-h*.42)}
 c.closePath();c.fill();
 c.beginPath();c.moveTo(-L*.08,h*.42);c.quadraticCurveTo(-L*.2,h*.85,-L*.28,h*.25);c.fill();
 c.beginPath();c.moveTo(L*.14,h*.42);c.quadraticCurveTo(L*.08,h*.8,L*.02,h*.45);c.fill();
 if(lk.finlets&&!dark){c.fillStyle=lk.finlets;for(let i=0;i<5;i++){const xx=-L*.24-i*L*.035;for(const s of[-1,1]){c.beginPath();c.moveTo(xx,s*(h*.22-i*h*.02));c.lineTo(xx-L*.02,s*(h*.36-i*h*.03));c.lineTo(xx-L*.03,s*(h*.2-i*h*.02));c.fill()}}}

function rodGeom(){

 else if(F.st==='reeling')ang=-.95+F.tension/100*.35;

 let bend=0;if(F.st==='reeling')bend=12+F.tension*.35;else if(F.st==='bite')bend=10;else if(F.st==='waiting')bend=3;
 if(bend){tip.x+=bend*.5;tip.y+=bend*.7}

const F={st:'idle',power:0,pdir:1,t:0,tx:0,bx:0,dip:0,wait:0,waitTot:1,nib:0,biteT:0,fish:null,tension:0,prog:0,reel:false,surge:0,surgeT:0,fx:0,fy:0,dir:-1,flen:40,adir:1};

function pickFish(){
 if(Math.random()<.05){const r=Math.random();return r<.15?{junk:'chest',id:'junk',w:+rand(6,18).toFixed(1),q:0}:r<.5?{junk:'bottle',id:'junk',w:.6,q:0}:{junk:'boot',id:'junk',w:1.2,q:0}}
 const b=BAIT[S.bait],pool=SPECIES.filter(s=>s.zone===S.zone),wx=WEATHERS[WX.i],luck=b.luck+wx.luck+(S.up.charm||0)*.1,nf=nightF();
 const ws=pool.map(s=>(s.rar<=3?s.rar*(1+luck*5):s.rar<12?s.rar*(1+luck*1.6):s.rar)*(1+((NIGHT[s.id]||1)-1)*nf));
 let r=Math.random()*ws.reduce((a,c)=>a+c,0),s=pool[0];for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){s=pool[i];break}}
 const k=Math.pow(Math.random(),1.8-b.big*1.2);const w=+(s.min+(s.max-s.min)*k).toFixed(2);
 const q=Math.random();const qi=q<.05+luck*.06?2:q<.25+luck*.1?1:0;
 return{id:s.id,w,q:qi};
}
function pressDown(){
 if(popOpen)return;
 if(F.st==='idle'){
  if(S.box.length>=cap()){toast('🧊 Your Fish Box is full! Sell some fish or mount trophies.');return}

 const tip=rodGeom().tip;F.tx=clamp(tip.x+120+F.power*(W-tip.x-170),tip.x+90,W-40);F.t=0;F.st='flying';
}

 F.st='reeling';F.fightT=0;F.breach=0;F.tension=15;F.prog=25;F.reel=true;F.surge=0;F.surgeT=.6;
 const s=SP[F.fish.id];F.flen=clamp(22+Math.sqrt(F.fish.w)*9,24,150);F.dir=-1;F.fx=F.bx;F.fy=surf(F.bx)+30;splash(F.bx,surf(F.bx),6);ripple(F.bx,2);sfx('splash');

  toast(j==='chest'?`💎 TREASURE CHEST! You found ${fmt(v)} inside!`:j==='bottle'?`🍾 A message in a bottle with ${fmt(v)} inside!`:'🥾 Just an old boot… someone paid $2 for it.');addXP(j==='chest'?150:15);renderAll();save();return}

 sfx('catch');pending=F.fish;addXP(10+fishValue(pending)/4);
 stat('caught');if(pending.q===2)stat('perfect');if(SP[pending.id].rar<=3)stat('legend');stat('biggest',pending.w,true);if(WEATHERS[WX.i].k==='storm')stat('storm');if(nightF()>.5)stat('night');

function update(dt){
 dayT=(dayT+dt/300)%1;
 amb.forEach(f=>{f.x+=f.v*dt;f.ph+=dt*5;if(f.x<-90)f.x=W+90;if(f.x>W+90)f.x=-90});

 birds.forEach(b=>{b.x+=b.v*dt;b.ph+=dt*7;if(b.x>W+30){b.x=-30;b.y=rand(40,150)}});
 ripples.forEach(r=>{r.r+=26*dt*r.big;r.a-=dt*.7});ripples=ripples.filter(r=>r.a>0);
 if(Math.random()<dt*2.5)bubbles.push({x:rand(0,W),y:H-30,r:rand(1,3),v:rand(20,45),ph:rand(0,6)});
 if(F.st==='reeling'&&Math.random()<dt*8)bubbles.push({x:F.fx,y:F.fy,r:rand(1,2.5),v:rand(30,60),ph:rand(0,6)});
 bubbles.forEach(b=>{b.y-=b.v*dt;b.x+=Math.sin(time*3+b.ph)*.3});bubbles=bubbles.filter(b=>b.y>surf(b.x)+3);
 updWeather(dt);updJumpers(dt);
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);
 F.dip*=Math.pow(.02,dt);shake*=Math.pow(.004,dt);updDerby(dt);
 switch(F.st){
  case'charging':F.power+=F.pdir*dt*1.1;if(F.power>1){F.power=1;F.pdir=-1}if(F.power<0){F.power=0;F.pdir=1}break;
  case'flying':F.t+=dt/.7;if(F.t>=1){F.st='waiting';F.bx=F.tx;splash(F.bx,surf(F.bx),5);ripple(F.bx,3);sfx('splash');F.waitTot=F.wait=rand(2.5,7)*BAIT[S.bait].bite*WEATHERS[WX.i].bite;F.next=pickFish();F.nib=rand(.8,1.5);F.adir=Math.random()<.5?-1:1}break;
  case'waiting':F.wait-=dt;F.nib-=dt;if(F.nib<=0&&F.wait>.6){F.dip=4;F.nib=rand(.9,2);ripple(F.bx,1,.6)}
   if(F.wait<=0){F.st='bite';F.biteT=.75+RODS[S.rod].reel*.12;F.fish=F.next||pickFish();F.next=null;splash(F.bx,surf(F.bx),5);ripple(F.bx,2);sfx('bite');buzz(60)}break;
  case'bite':F.biteT-=dt;F.dip=9+Math.sin(time*30)*4;if(F.biteT<=0){F.st='idle';toast('Too slow — the fish stole your bait!')}break;
  case'reeling':{
   const rod=RODS[S.rod],d=F.fish.w/rod.power;
   F.surgeT-=dt;if(F.surgeT<=0){F.surge=Math.random()<.4?rand(.5,1.2):rand(0,.25);F.surgeT=rand(.5,1.6);if(F.surge>.5){splash(F.fx,surf(F.fx),3);ripple(F.fx,1);if(d>.35)shake=Math.max(shake,1.5+2.5*Math.min(d,1.4))}}
   if(F.reel){F.clk=(F.clk||0)-dt;if(F.clk<=0){sfx('click');F.clk=.07}}
   const pull=(.2+F.surge)*Math.min(d,2.2);
   if(F.reel){F.tension+=(10+95*pull)*dt;F.prog+=(15*rod.reel/(.55+d*.9))*dt}
   else{F.tension-=(42-20*Math.min(pull,1))*dt;F.prog-=(2.5+9*pull)*dt}
   F.tension=Math.max(0,F.tension);
   const tip=rodGeom().tip,k=clamp(F.prog/100,0,1);
   F.fx=F.bx+(tip.x+40-F.bx)*k+Math.sin(time*6)*F.surge*18;
   F.fy=Math.min(H-60,surf(F.fx)+18+F.flen*.15+(1-k)*(60+Math.min(F.fish.w,80)));
   if(!F.breach&&F.fish.w>=15&&!F.fish.junk&&F.surge>.9&&k>.25&&k<.85&&Math.random()<dt*1.5){F.breach=1;splash(F.fx,surf(F.fx),6);sfx('splash');F.tension+=8}
   if(F.breach>0){F.breach-=dt;const bt=1-Math.max(0,F.breach);F.fy=surf(F.fx)-Math.sin(bt*Math.PI)*(40+Math.min(F.flen,120)*.5);if(F.breach<=0){F.breach=-1;splash(F.fx,surf(F.fx),10);ripple(F.fx,3);sfx('splash');shake=Math.max(shake,4)}}
   if(F.tension>=100){F.st='idle';F.reel=false;splash(F.fx,surf(F.fx),6);sfx('snap');buzz(200);shake=6;toast(`💥 SNAP! Something heavy broke your line. A stronger rod would help.`)}
   else if(F.prog<=0){F.st='idle';F.reel=false;toast('The fish shook off the hook!')}
   else if((F.fightT+=dt)>30){F.st='idle';F.reel=false;toast('The fish wore you out and got away. Try a stronger rod!')}
   else if(F.prog>=100)landFish();
  }break;
 }
}

// ======================= CATCH POPUP =======================
function showPop(f,rec){
 popOpen=true;const s=SP[f.id];$('#pop').classList.remove('hidden');
 const c=$('#popFish').getContext('2d');c.setTransform(2,0,0,2,0,0);const bg=c.createLinearGradient(0,0,0,120);bg.addColorStop(0,'#1f6488');bg.addColorStop(1,'#08202f');c.fillStyle=bg;c.fillRect(0,0,300,120);
 c.save();c.globalCompositeOperation='lighter';for(let i=0;i<6;i++){c.fillStyle='rgba(170,230,255,.06)';c.beginPath();c.moveTo(20+i*55,0);c.lineTo(45+i*55,0);c.lineTo(30+i*55,120);c.lineTo(5+i*55,120);c.fill()}c.restore();
 for(let i=0;i<14;i++){c.strokeStyle='rgba(220,245,255,.35)';c.beginPath();c.arc(Math.random()*300,Math.random()*120,1+Math.random()*2,0,7);c.stroke()}
 const bill=LOOK[f.id]&&LOOK[f.id].bill,Lf=bill?165:Math.min(220,120+Math.sqrt(f.w)*9);drawFish(c,bill?115:150,62,Lf,s.col,1,0,1,false,f.id);
 $('#popName').textContent=s.name;
 let tags='';if(s.rar<=3)tags+='<span class="tag leg">LEGENDARY</span>';if(f.q)tags+=`<span class="tag q${f.q}">${QUAL[f.q].n}</span>`;if(rec)tags+='<span class="tag rec">NEW PERSONAL BEST</span>';
 $('#popTags').innerHTML=tags;
 const m=M[f.id].m;$('#popInfo').innerHTML=`${f.w} kg · ${fmt(priceKg(f.id))}/kg <span class="${m>=1?'up':'down'}">(${m>=1?'+':''}${Math.round((m-1)*100)}% vs normal)</span>`;
 $('#popVal').textContent='Worth '+fmt(fishValue(f))+' right now';
 $('#bKeep').disabled=S.box.length>=cap();
}
function closePop(){popOpen=false;pending=null;$('#pop').classList.add('hidden');renderAll();save()}
$('#bKeep').onclick=()=>{if(!pending||S.box.length>=cap())return;S.box.push(pending);toast('Kept in your Fish Box 🧊');closePop()};
$('#bSell').onclick=()=>{if(!pending)return;const v=fishValue(pending);earn(v);toast('Sold for '+fmt(v)+' 💰');closePop()};
$('#bMount').onclick=()=>{if(!pending)return;S.trophies.push(pending);toast('Mounted on your trophy wall 🏆');closePop()};

// ======================= MARKET =======================
function tickMarket(){
 SPECIES.forEach(s=>{const p=M[s.id];p.m+=(1-p.m)*.05+gauss()*.06;p.m=clamp(p.m,.4,2.8);p.h.push(p.m);if(p.h.length>40)p.h.shift()});
 if(Math.random()<.1){
  const pool=SPECIES.filter(s=>s.zone<=S.boat),s=pool[Math.floor(Math.random()*pool.length)],up=Math.random()<.6;
  M[s.id].m=clamp(M[s.id].m*(up?rand(1.5,1.9):rand(.5,.65)),.4,2.8);
  toast(up?`📈 Restaurants want ${s.name}! Price jumped.`:`📉 Too much ${s.name} at the market. Price dropped.`);
 }
 if((tab==='market'||tab==='box'||tab==='dex')&&!panelHold)renderPanel();
}

// ======================= UI =======================
let tab='market',panelHold=false;
$('#panel').addEventListener('pointerdown',()=>{panelHold=true});
window.addEventListener('pointerup',()=>setTimeout(()=>{panelHold=false},120));
function renderHUD(){
 $('#hMoney').textContent=fmt(S.money);$('#hRod').textContent='🎣 '+RODS[S.rod].name;
 $('#hBait').textContent='🪱 '+BAIT[S.bait].name+(S.bait?' ×'+S.baitQty[S.bait]:'');
 $('#hLvl').textContent=`⭐ Lv ${S.lvl} · ${S.xp}/${xpNeed(S.lvl)} XP`;$('#hWx').textContent=WEATHERS[WX.i].n+(nightF()>.5?' · 🌙 Night':'');
 $('#hBoat').textContent='⛵ '+BOATS[S.boat].name;$('#hBox').textContent=`🧊 ${S.box.length}/${cap()}`;
}
function renderZones(){
 $('#zones').innerHTML=ZONES.map((z,i)=>`<button class="sm ${S.zone===i?'on':''}" data-z="${i}" ${i>S.boat?'disabled title="Needs '+BOATS[i].name+'"':''}>${i>S.boat?'🔒 ':''}${z.name}</button>`).join('');
 document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{if(F.st!=='idle'){toast('Reel in before moving!');return}if(D.on){toast('Finish the derby first!');return}S.zone=+b.dataset.z;genZone();renderAll();save()});
}
function spark(h){const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;const pts=h.map((v,i)=>`${(i/(h.length-1)*90).toFixed(1)},${(22-(v-mn)/r*20).toFixed(1)}`).join(' ');const c=h[h.length-1]>=h[0]?'#4cc38a':'#e5534b';return`<svg width="90" height="24" viewBox="0 0 90 24" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${pts}"/></svg>`}
function trend(id){const h=M[id].h,d=h[h.length-1]-h[Math.max(0,h.length-6)];return d>.02?'<span class="up">▲</span>':d<-.02?'<span class="down">▼</span>':'<span class="muted">•</span>'}
function renderPanel(){
 const p=$('#panel');
 if(tab==='market'){
  p.innerHTML=`<div class="row"><span class="muted">Prices change every few seconds. Keep fish in your Fish Box and sell when the price is high! Your level gives <b>+${(S.lvl-1)*2}%</b> on every sale. 🌙 Catfish, walleye, cod and swordfish bite more at night.</span></div>
  <table><tr><th>Fish</th><th>Area</th><th>Price / kg</th><th>vs normal</th><th>Trend</th></tr>${SPECIES.map(s=>{const m=M[s.id].m,lock=s.zone>S.boat;return`<tr class="${lock?'locked':''}"><td>${s.rar<=3?'⭐ ':''}${S.dex[s.id]||!lock?s.name:'???'}</td><td>${ZONES[s.zone].name}</td><td>${fmt(priceKg(s.id))} ${trend(s.id)}</td><td class="${m>=1?'up':'down'}">${m>=1?'+':''}${Math.round((m-1)*100)}%</td><td>${spark(M[s.id].h)}</td></tr>`}).join('')}</table>`;
 }else if(tab==='box'){
  const tot=S.box.reduce((a,f)=>a+fishValue(f),0);
  const list=S.box.map((f,i)=>({f,i,v:fishValue(f)})).sort((a,b)=>b.v-a.v);
  p.innerHTML=`<div class="row"><span>Fish Box <b>${S.box.length}/${cap()}</b> · total value <b class="money">${fmt(tot)}</b></span><button class="gold sm" id="sellAll" ${S.box.length?'':'disabled'}>Sell all</button></div>
  ${S.box.length?`<table><tr><th>Fish</th><th>Weight</th><th>Quality</th><th>Value now</th><th></th></tr>${list.map(({f,i,v})=>`<tr><td>${SP[f.id].name}</td><td>${f.w} kg</td><td>${QUAL[f.q].n}</td><td>${fmt(v)} ${trend(f.id)}</td><td style="text-align:right"><button class="sm gold" data-sell="${i}">Sell</button> <button class="sm" data-mount="${i}">🏆</button></td></tr>`).join('')}</table>`:'<p class="muted">Empty. Fish you choose to keep will show up here.</p>'}`;
  const sa=$('#sellAll');if(sa)sa.onclick=()=>{earn(tot);toast('Sold everything for '+fmt(tot)+' 💰');S.box=[];renderAll();save()};
  p.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const f=S.box.splice(+b.dataset.sell,1)[0],v=fishValue(f);earn(v);toast(`Sold ${SP[f.id].name} for ${fmt(v)}`);renderAll();save()});
  p.querySelectorAll('[data-mount]').forEach(b=>b.onclick=()=>{S.trophies.push(S.box.splice(+b.dataset.mount,1)[0]);toast('Mounted 🏆');renderAll();save()});
 }else if(tab==='orders'){
  ensureOrders();
  p.innerHTML=derbyHTML()+`<div class="row"><span class="muted">Restaurants pay extra for specific fish. Keep fish in your Fish Box, then deliver.</span><button class="sm" id="reroll" ${S.money<25?'disabled':''}>New orders · $25</button></div>
  <div class="grid">${S.orders.map((o,i)=>{const have=S.box.filter(f=>f.id===o.id).length;return`<div class="item"><h4>🍽️ ${o.who}</h4><p>Wants <b>${o.qty} × ${SP[o.id].name}</b><br>You have ${have}/${o.qty} in your Fish Box</p><div class="row" style="margin:0"><span class="money">${fmt(o.pay)}</span><button class="sm gold" data-del="${i}" ${have<o.qty?'disabled':''}>Deliver</button></div></div>`}).join('')}</div>`;
  const db=$('#derbyBtn');if(db)db.onclick=startDerby;
  $('#reroll').onclick=()=>{if(S.money<25)return;S.money-=25;S.orders=[];ensureOrders();renderAll();save()};
  p.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const o=S.orders[+b.dataset.del];const mine=S.box.map((f,i)=>({f,i})).filter(x=>x.f.id===o.id).sort((a,b)=>fishValue(a.f)-fishValue(b.f)).slice(0,o.qty).map(x=>x.i);if(mine.length<o.qty)return;
   S.box=S.box.filter((_,i)=>!mine.includes(i));stat('orders');earn(o.pay);addXP(o.pay/5);toast(`📜 ${o.who} paid ${fmt(o.pay)}!`);S.orders.splice(+b.dataset.del,1);ensureOrders();renderAll();save()});
 }else if(tab==='shop'){
  p.innerHTML=`<h3>🎣 Rods</h3><div class="grid">${RODS.map((r,i)=>{const own=S.ownedRods.includes(i);return`<div class="item ${S.rod===i?'own':''}"><h4>${r.name}</h4><p>${r.desc}<br>Strength: ${r.power} kg · Reel speed ×${r.reel}</p>${S.rod===i?'<button class="sm" disabled>Equipped</button>':own?`<button class="sm pri" data-eq="${i}">Equip</button>`:`<button class="sm gold" data-rod="${i}" ${S.money<r.price?'disabled':''}>Buy ${fmt(r.price)}</button>`}</div>`}).join('')}</div>
  <h3 style="margin-top:16px">🪱 Bait <span class="muted">(packs of 10)</span></h3><div class="grid">${BAIT.map((b,i)=>`<div class="item ${S.bait===i?'own':''}"><h4>${b.name}${i?` <span class="muted">×${S.baitQty[i]}</span>`:''}</h4><p>${b.desc}<br>Bite speed ×${(1/b.bite).toFixed(2)} · Rare luck +${Math.round(b.luck*100)}%</p>${i?`<button class="sm gold" data-bait="${i}" ${S.money<b.price?'disabled':''}>Buy 10 · ${fmt(b.price)}</button> `:''}${S.bait===i?'<button class="sm" disabled>Using</button>':`<button class="sm pri" data-use="${i}" ${i&&!S.baitQty[i]?'disabled':''}>Use</button>`}</div>`).join('')}</div>
  <h3 style="margin-top:16px">⛵ Boats</h3><div class="grid">${BOATS.map((b,i)=>`<div class="item ${S.boat===i?'own':''}"><h4>${b.name}</h4><p>${b.desc}<br>Fish Box holds ${b.cap} fish</p>${i<=S.boat?'<button class="sm" disabled>Owned</button>':i>S.boat+1?'<button class="sm" disabled>Buy previous boat first</button>':`<button class="sm gold" data-boat="${i}" ${S.money<b.price?'disabled':''}>Buy ${fmt(b.price)}</button>`}</div>`).join('')}</div>`;
  p.insertAdjacentHTML('beforeend',`<h3 style="margin-top:16px">🔧 Upgrades</h3><div class="grid">${UPGRADES.map(u=>{const l=S.up[u.k]||0;return`<div class="item ${l?'own':''}"><h4>${u.name}${u.max>1?` <span class="muted">Lv ${l}/${u.max}</span>`:''}</h4><p>${u.desc}</p>${l>=u.max?`<button class="sm" disabled>${u.max>1?'Maxed':'Owned'}</button>`:`<button class="sm gold" data-up="${u.k}" ${S.money<u.price[l]?'disabled':''}>Buy ${fmt(u.price[l])}</button>`}</div>`}).join('')}</div>`);
  p.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const u=UPGRADES.find(x=>x.k===b.dataset.up),l=S.up[u.k]||0;if(l>=u.max||S.money<u.price[l])return;S.money-=u.price[l];S.up[u.k]=l+1;sfx('level');toast(`${u.name} upgraded!`);renderAll();save()});
  p.querySelectorAll('[data-rod]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rod;if(S.money<RODS[i].price)return;S.money-=RODS[i].price;S.ownedRods.push(i);S.rod=i;toast('New rod: '+RODS[i].name+'!');renderAll();save()});
  p.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{S.rod=+b.dataset.eq;renderAll();save()});
  p.querySelectorAll('[data-bait]').forEach(b=>b.onclick=()=>{const i=+b.dataset.bait;if(S.money<BAIT[i].price)return;S.money-=BAIT[i].price;S.baitQty[i]+=10;S.bait=i;renderAll();save()});
  p.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.bait=+b.dataset.use;renderAll();save()});
  p.querySelectorAll('[data-boat]').forEach(b=>b.onclick=()=>{const i=+b.dataset.boat;if(S.money<BOATS[i].price)return;S.money-=BOATS[i].price;S.boat=i;checkAch();if(F.st==='idle'&&!D.on){S.zone=i;genZone();toast(`⛵ You bought a ${BOATS[i].name}! Welcome to ${ZONES[i].name}.`)}else toast(`⛵ ${BOATS[i].name} bought! Finish this cast, then travel to ${ZONES[i].name}.`);renderAll();save()});
 }else{
  const caught=Object.keys(S.dex).length;
  p.innerHTML=`<h3>🏆 Trophy Wall</h3>${S.trophies.length?`<table><tr><th>Fish</th><th>Weight</th><th>Quality</th><th>Collector offer</th><th></th></tr>${S.trophies.map((f,i)=>`<tr><td>${SP[f.id].rar<=3?'⭐ ':''}${SP[f.id].name}</td><td>${f.w} kg</td><td>${QUAL[f.q].n}</td><td>${fmt(fishValue(f)*1.5)}</td><td style="text-align:right"><button class="sm gold" data-ts="${i}">Sell to collector</button></td></tr>`).join('')}</table>`:'<p class="muted">No trophies yet. Mount a fish you are proud of. Collectors pay 1.5× the market price for mounted fish.</p>'}
  <h3 style="margin-top:16px">📖 Fish Log — ${caught}/${SPECIES.length} species</h3><div class="dex">${SPECIES.map(s=>{const d=S.dex[s.id];return`<div><b>${d?(s.rar<=3?'⭐ ':'')+s.name:'???'}</b>${ZONES[s.zone].name}<br>${d?`Caught ${d.n} · Best ${d.best} kg`:'Not caught yet'}</div>`}).join('')}</div>`;
  const na=ACH.filter(a=>S.ach[a.id]).length,st=S.stats;
  p.insertAdjacentHTML('beforeend',`<h3 style="margin-top:16px">🏅 Achievements · ${na}/${ACH.length}</h3><p class="muted" style="margin-top:-4px">Fish caught: ${st.caught||0} · Biggest: ${st.biggest||0} kg · Total earned: ${fmt(st.earned||0)}</p><div class="dex">${ACH.map(a=>`<div style="${S.ach[a.id]?'border-color:var(--gold)':'opacity:.55'}"><b>${S.ach[a.id]?'🏅':'🔒'} ${a.n}</b>${a.d}<br><span class="money">+${fmt(a.r)}</span></div>`).join('')}</div>`);
  p.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{const f=S.trophies.splice(+b.dataset.ts,1)[0],v=fishValue(f)*1.5;earn(v);toast('A collector paid '+fmt(v)+'!');renderAll();save()});
 }
}
function renderAll(){renderHUD();renderZones();renderPanel()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));renderPanel()});
$('#reset').onclick=e=>{e.preventDefault();if(confirm('Reset all progress?')){resetting=true;try{localStorage.removeItem(KEY)}catch(_){}location.reload()}};

cv.addEventListener('pointerdown',e=>{e.preventDefault();pressDown()});
const cb=$('#castBtn');cb.addEventListener('pointerdown',e=>{e.preventDefault();pressDown()});
window.addEventListener('pointerup',pressUp);window.addEventListener('pointercancel',pressUp);

['contextmenu','selectstart'].forEach(ev=>{cv.addEventListener(ev,e=>e.preventDefault());$('#castBtn').addEventListener(ev,e=>e.preventDefault())});

setInterval(()=>{const l={idle:'Hold to Cast',charging:'Release to Cast!',flying:'Casting…',waiting:'Waiting for a bite…',bite:'HOOK IT!',reeling:'Hold to Reel'};cb.textContent=l[F.st]||'Hold to Cast'},100);

// ======================= START =======================
if(S.zone>S.boat)S.zone=S.boat;
genZone();ensureOrders();renderAll();
const mb=$('#mute');mb.textContent=muted?'🔇':'🔊';mb.onclick=()=>{muted=!muted;mb.textContent=muted?'🔇':'🔊';try{localStorage.setItem('deeptide_mute',muted?'1':'0')}catch(e){}};
setInterval(renderHUD,2000);
setTimeout(checkAch,1500);
setInterval(tickMarket,3500);setInterval(save,5000);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
