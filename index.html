<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cast & Conquer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful adventure, a fishing trip that turns into a monster hunt
   IDEA: a painted postcard of each fishing spot you can drop a line into
   PICTURE: cut-away lake (or lava lake) with boat, fish, chests and bosses
   COLOUR and TYPE: lake teal + sunset orange accent, lava reds in Lava Lake; Lilita One titles, Nunito body
   LAYOUT: title + places row, big stage, boss bar, then shop + journal */
:root{color-scheme:light dark;--bg:light-dark(#f7efe2,#0e1d25);--ink:light-dark(#1b2a31,#edf3f0);--mut:light-dark(#5d6a6f,#9fb2b5);--card:light-dark(#fffaf2,#162c37);--line:light-dark(#e6d7bf,#2a4757);--acc:#ff7a3d;--teal:light-dark(#0f5566,#5fc4cf)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1140px;margin:0 auto;padding:clamp(14px,3vw,32px) max(4vw,12px)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
h1{font:400 clamp(30px,5vw,46px)/1.05 'Lilita One',sans-serif;margin:0;color:var(--teal);flex:1 1 auto}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-weight:800;white-space:nowrap}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f2a516);box-shadow:inset 0 -2px 0 #c97d0b}
button{font:800 15px Nunito,sans-serif;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--acc);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
button:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
#areas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#areas button{background:var(--card);color:var(--ink);border:2px solid var(--line)}
#areas button.on{background:var(--teal);border-color:var(--teal);color:var(--bg)}
#areas button.on.lava{background:#d63a0f;border-color:#d63a0f;color:#fff}
#areas button:disabled{opacity:.6;background:var(--card)}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px -18px #0b3540;background:#0f4c5c}
#cv{display:block;width:100%;aspect-ratio:960/600;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.under{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:10px}
#hint{margin:0;font-weight:700;color:var(--mut);flex:1 1 300px}
#hint b{color:var(--acc)}
#boss{background:#7b3fc4}#boss.lava{background:#c22e0b}#boss:disabled{background:var(--line);color:var(--mut)}
#card{position:absolute;inset:0;display:none;place-items:center;background:#06212acc;padding:12px}
#card.on{display:grid}
.cbox{background:var(--card);border-radius:18px;padding:20px 22px;text-align:center;width:min(340px,100%);animation:pop .35s ease-out}
.cbox svg{width:min(220px,70%);height:auto}
.cbox h2{font:400 30px/1.05 'Lilita One',sans-serif;margin:4px 0}
.tag{display:inline-block;background:#ffd166;color:#4a3300;border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px}
.cbox p{margin:4px 0 14px;color:var(--mut);font-weight:700}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.cbox{animation:none}}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.panel h3{font:400 24px/1.1 'Lilita One',sans-serif;margin:0 0 6px}
.panel h4{margin:16px 0 4px;font-size:15px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:700}
.row div{flex:1}.row small{display:block;color:var(--mut);font-weight:600;font-size:13px}
.row button{min-width:100px}
.jr{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.jr h5{grid-column:1/-1;margin:10px 0 0;font-size:15px;color:var(--mut)}
.jr div{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-weight:800;font-size:14px}
.jr svg{width:100%;height:44px;color:var(--line)}
.jr small{display:block;color:var(--mut);font-weight:600;font-size:13px}
footer{margin-top:16px;display:flex;justify-content:flex-end}
</style></head><body>
<div class="wrap">
<header>
  <h1>Cast &amp; Conquer</h1>
  <div class="pill"><span class="coin"></span><span id="coins">0</span></div>
  <div class="pill">Cooler: <span id="cnum">0</span> fish <button id="sell">Sell</button></div>
</header>
<nav id="areas" aria-label="Fishing spots"></nav>
<div class="stage">
  <canvas id="cv" aria-label="Fishing spot. Press and hold to cast."></canvas>
  <div id="card" role="dialog" aria-modal="true"><div class="cbox" id="cbox"></div></div>
</div>
<div class="under"><p id="hint"></p><button id="boss" disabled>Boss</button></div>
<div class="grid">
  <section class="panel"><h3>Shop</h3>
    <h4>Boats</h4><div id="boats"></div>
    <h4>Rods (stronger line, reaches deeper)</h4><div id="rods"></div>
    <h4>Bait (more bites, rarer fish)</h4><div id="baits"></div>
    <h4>Gear</h4><div id="gear"></div>
  </section>
  <section class="panel"><h3>Fish journal</h3><div id="jcount" style="color:var(--mut);font-weight:700"></div><div class="jr" id="journal"></div></section>
</div>
<footer><button class="ghost" id="reset">Start over</button></footer>
</div>
<script>
{
const W=960,H=600,SURF=200,BOT=578;
const SP=[
 {a:'lake',id:'bluegill',name:'Bluegill',c:'#4f86c6',d:'#22436b',b:'#f2b24e',h:.32,min:.1,max:.6,y:[215,330],str:.5,w:30,v:6,L:[22,34]},
 {a:'lake',id:'perch',name:'Yellow Perch',c:'#b9bb45',d:'#4a5a20',b:'#f6ecb2',h:.25,min:.2,max:1.2,y:[225,370],str:.7,w:25,v:8,L:[26,42],st:1},
 {a:'lake',id:'trout',name:'Rainbow Trout',c:'#9db58c',d:'#3d5a48',b:'#f3c8c2',h:.22,min:.5,max:3.5,y:[245,420],str:1.1,w:18,v:10,L:[32,58],pk:1},
 {a:'lake',id:'bass',name:'Largemouth Bass',c:'#6f9a4a',d:'#2c4720',b:'#ece3b2',h:.27,min:1,max:5,y:[290,460],str:1.5,w:14,v:9,L:[36,64]},
 {a:'lake',id:'koi',name:'Golden Koi',c:'#ffb02e',d:'#e0561c',b:'#fff1c4',h:.27,min:2,max:8,y:[260,480],str:2,w:1.6,v:70,L:[36,62],kp:1},
 {a:'lake',id:'pike',name:'Northern Pike',c:'#7d8f4a',d:'#36421d',b:'#e8e4ba',h:.14,min:3,max:12,y:[320,500],str:2.6,w:6,v:9,L:[52,96],sp:1},
 {a:'lake',id:'catfish',name:'Channel Catfish',c:'#7a6550',d:'#3a2e24',b:'#dccfb6',h:.2,min:2,max:15,y:[430,565],str:2.2,w:8,v:6,L:[44,90],wh:1},
 {a:'lake',id:'sturgeon',name:'Lake Sturgeon',c:'#8a96a0',d:'#434f59',b:'#e2e6e8',h:.14,min:10,max:60,y:[490,565],str:3.6,w:1.6,v:14,L:[80,150],wh:1},
 {a:'lava',id:'ember',name:'Ember Minnow',c:'#ff8a3d',d:'#9c2a0c',b:'#ffd36b',h:.28,min:.1,max:.8,y:[215,340],str:.6,w:30,v:14,L:[22,34]},
 {a:'lava',id:'cinder',name:'Cinder Bass',c:'#5a4a48',d:'#231a1a',b:'#ff9a4a',h:.27,min:1,max:5,y:[260,430],str:1.4,w:20,v:16,L:[34,60],sp:1},
 {a:'lava',id:'magmaeel',name:'Magma Eel',c:'#ff5a1f',d:'#7a1205',b:'#ffcf5a',h:.1,min:1,max:6,y:[300,480],str:1.9,w:14,v:18,L:[60,110],st:1},
 {a:'lava',id:'obsidian',name:'Obsidian Pike',c:'#2c2a38',d:'#0d0c14',b:'#7a6fa8',h:.14,min:3,max:14,y:[340,520],str:2.8,w:8,v:16,L:[56,100],sp:1},
 {a:'lava',id:'phoenix',name:'Phoenix Koi',c:'#ff3d6e',d:'#a3123a',b:'#ffe08a',h:.27,min:2,max:9,y:[260,500],str:2.3,w:1.6,v:90,L:[38,64],kp:1},
 {a:'lava',id:'dragon',name:'Dragon Carp',c:'#d4a017',d:'#7a4a05',b:'#fff0b0',h:.24,min:15,max:70,y:[480,565],str:3.9,w:1.4,v:22,L:[80,150],wh:1}
];
const BOSS={
 lake:{id:'kraken',name:'The Lake Kraken',kind:'squid',c:'#8a4fd1',d:'#3f1d6e',b:'#e2c4ff',str:2.4,len:170,reward:600,need:6,min:1,max:1},
 lava:{id:'serpent',name:'The Magma Serpent',kind:'serpent',c:'#ff4d1a',d:'#5a0d00',b:'#ffd24a',str:3.6,len:230,reward:1500,need:6,min:1,max:1}};
const AREAS={lake:'Sunset Lake',lava:'Lava Lake'};
const RODS=[{name:'Bamboo pole',str:1,depth:330,cost:0},{name:'Fiberglass rod',str:1.7,depth:410,cost:60},{name:'Carbon rod',str:2.6,depth:500,cost:220},{name:'Deep-sea rod',str:3.8,depth:570,cost:650}];
const BAITS=[{name:'Worms',luck:0,bite:1,cost:0,txt:'The classic'},{name:'Shrimp',luck:1,bite:1.6,cost:45,txt:'More bites, rarer fish'},{name:'Glow jig',luck:2.5,bite:2.2,cost:180,txt:'Lots of bites, rare fish love it'}];
const BOATS=[{name:'Rowboat',cost:0,reel:1,cast:1,txt:'Slow but steady'},{name:'Speedboat',cost:150,reel:1.25,cast:1.2,txt:'Reel 25% faster, cast farther'},{name:'Lava Barge',cost:500,reel:1.4,cast:1.3,txt:'Heat-proof steel. Unlocks Lava Lake'}];
const GEAR=[{id:'hat',name:'Lucky hat',cost:90,txt:'Treasure chests show up twice as often'},{id:'finder',name:'Fish finder',cost:120,txt:'Shows every fish\'s name and weight'}];
const KEY='lakeside-fishing-1';
const fresh=()=>({coins:0,rod:0,bait:0,boat:0,ownR:[0],ownB:[0],ownO:[0],gear:[],area:'lake',cooler:[],journal:{},trophies:{},bossCharge:{lake:0,lava:0}});
let S=fresh();
try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S=Object.assign(fresh(),d)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');let sc=1;
const fit=()=>{const w=cv.clientWidth||960,d=window.devicePixelRatio||1;cv.width=Math.round(w*d);cv.height=Math.round(w*H/W*d);sc=w/W*d};
const ro=new ResizeObserver(fit);ro.observe(cv);fit();
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>n.toLocaleString();
const has=id=>S.gear.includes(id);

const g={mode:'idle',power:0,pdir:1,lure:{x:0,y:0,vx:0,vy:0},fish:[],target:null,biteT:0,hooked:null,p:0,tension:0,stamina:1,surgeT:1,surging:false,surgeAge:0,msg:'',msgT:0,parts:[],start:null,shake:0};
let held=false,t=0,cardOpen=false;
const regular=()=>g.fish.filter(f=>!f.boss&&!f.chest).length;
const bossHere=()=>g.fish.find(f=>f.boss&&!f.flee);

function pick(){const L=BAITS[S.bait].luck,list=SP.filter(s=>s.a===S.area);const ws=list.map(s=>s.w*(s.w<10?1+L*1.2:1));let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}return list[0]}
function spawn(onScreen){const s=pick(),wt=s.min+(s.max-s.min)*Math.random()**2,dir=Math.random()<.5?1:-1,k=(wt-s.min)/(s.max-s.min);
 g.fish.push({s,wt,dir,len:s.L[0]+(s.L[1]-s.L[0])*k,x:onScreen?rnd(260,W-40):(dir>0?-90:W+90),y:rnd(s.y[0],Math.min(s.y[1],BOT-14)),sp:rnd(28,62),ph:rnd(0,6)})}
function resetArea(){g.fish=[];g.parts=[];g.mode='idle';g.target=null;g.hooked=null;held=false;for(let i=0;i<7;i++)spawn(true)}
resetArea();

function say(m,s=2.4){g.msg=m;g.msgT=s}
function splash(x,y,n=14){for(let i=0;i<n;i++)g.parts.push({x,y,vx:rnd(-90,90),vy:rnd(-220,-60),life:rnd(.5,.9),k:'s'})}
function rodTip(){const bob=Math.sin(t*1.5)*2,bend=g.mode==='reel'?18+g.tension*22:0;return{x:250-bend*.4,y:95+bob+bend}}
function inRange(f){const y=g.lure.y;return y>f.s.y[0]-35&&y<f.s.y[1]+35}
function loseTarget(){g.target=null}
function hook(f){g.mode='reel';g.hooked=f;f.hooked=true;g.target=null;g.p=.12;g.tension=.15;g.stamina=1;g.surging=false;g.surgeT=rnd(.8,1.6);g.start={x:g.lure.x,y:g.lure.y}}

function down(){if(cardOpen)return;held=true;
 if(g.mode==='idle'){g.mode='charge';g.power=0;g.pdir=1}
 else if(g.mode==='bite'){const f=g.target;hook(f);say(f.boss?'BOSS FIGHT!':'Fish on!',f.boss?2:1.2)}}
function up(){if(!held)return;held=false;
 if(g.mode==='charge'){const tip=rodTip(),c=BOATS[S.boat].cast;g.mode='fly';g.lure={x:tip.x,y:tip.y,vx:(130+g.power*560)*c,vy:-170-g.power*130}}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();down()});
addEventListener('pointerup',up);addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!cardOpen&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();down()}});
addEventListener('keyup',e=>{if(e.code==='Space')up()});

function endFight(msg){const f=g.hooked;if(f){f.hooked=false;if(f.chest)g.fish.splice(g.fish.indexOf(f),1);else{f.flee=true;f.dir=1}}g.hooked=null;g.mode='idle';say(msg);renderUI()}
function land(){const f=g.hooked,s=f.s;g.fish.splice(g.fish.indexOf(f),1);g.hooked=null;g.mode='idle';
 const tip=rodTip();splash(tip.x+20,SURF,24);
 if(f.chest){const r=Math.random(),v=Math.round(r<.05?rnd(400,700):r<.3?rnd(100,250):rnd(25,80));S.coins+=v;save();renderUI();
  showCard(`<span class="tag">${v>=400?'Golden chest!':'Treasure!'}</span>${chestSVG()}<h2>${v>=400?'Golden chest':'Treasure chest'}</h2><p>+${fmt(v)} coins</p>`);return}
 if(f.boss){S.coins+=s.reward;S.trophies[s.id]=(S.trophies[s.id]||0)+1;save();renderUI();
  showCard(`<span class="tag">Boss defeated!</span>${bossSVG(s,true)}<h2>${s.name}</h2><p>+${fmt(s.reward)} coins and a trophy</p>`);return}
 const wt=Math.round(f.wt*100)/100,val=Math.max(1,Math.round(wt*s.v)),j=S.journal[s.id],isNew=!j;
 S.journal[s.id]={n:(j?j.n:0)+1,best:Math.max(j?j.best:0,wt)};S.bossCharge[S.area]=(S.bossCharge[S.area]||0)+1;
 S.cooler.push({id:s.id,wt,val});save();renderUI();
 showCard(`${isNew?'<span class="tag">New species!</span>':j&&wt>j.best?'<span class="tag">New record!</span>':''}${fsvg(s,true)}<h2>${s.name}</h2><p>${wt} kg · worth ${fmt(val)} coins</p>`)}

function update(dt){t+=dt;
 const r=RODS[S.rod],b=BAITS[S.bait],L=g.lure;
 if(g.mode==='charge'){g.power+=g.pdir*dt*1.1;if(g.power>1){g.power=1;g.pdir=-1}if(g.power<0){g.power=0;g.pdir=1}}
 else if(g.mode==='fly'){L.vy+=600*dt;L.x+=L.vx*dt;L.y+=L.vy*dt;if(L.x>W-20){L.x=W-20;L.vx=0}
  if(L.y>=SURF&&L.vy>0){L.y=SURF;g.mode='wait';splash(L.x,SURF)}}
 else if(g.mode==='wait'){const maxY=Math.min(r.depth,BOT-6);
  if(held){const dx=270-L.x,dy=SURF+4-L.y,d=Math.hypot(dx,dy);if(d<14){g.mode='idle';loseTarget();say('Reeled in. Cast again!',1.6)}else{L.x+=dx/d*95*dt;L.y+=dy/d*95*dt}}
  else if(L.y<maxY)L.y=Math.min(maxY,L.y+45*dt);
  if(Math.random()<dt*1.5)g.parts.push({x:L.x+rnd(-3,3),y:L.y,vx:0,vy:-30,life:1.5,k:'b'});
  const ch=g.fish.find(f=>f.chest&&Math.hypot(f.x-L.x,f.y-L.y)<28);
  const boss=bossHere();
  if(ch){hook(ch);say('Treasure hooked!',1.4)}
  else{
   if(boss&&g.target!==boss&&L.y>SURF+10)g.target=boss;
   if(!g.target){for(const f of g.fish){if(f.flee||f.hooked||f.chest||f.boss)continue;if(Math.hypot(f.x-L.x,f.y-L.y)<150&&inRange(f)&&Math.random()<.3*b.bite*dt){g.target=f;break}}}
   else{const f=g.target,dx=L.x-f.x,dy=L.y-f.y,d=Math.hypot(dx,dy);f.dir=dx>=0?1:-1;
    if(d<(f.boss?40:f.len*.5+4)){g.mode='bite';g.biteT=f.boss?1.2:.9+.1*S.rod}else{const v=f.boss?150:70;f.x+=dx/d*v*dt;f.y+=dy/d*v*dt}}}}
 else if(g.mode==='bite'){g.biteT-=dt;if(g.biteT<=0){const f=g.target;f.flee=true;f.dir=f.x<L.x?-1:1;g.target=null;g.mode='idle';say(f.boss?'The boss swam off with your bait!':'Too slow! It stole your bait.');renderUI()}}
 else if(g.mode==='reel'){const f=g.hooked,boat=BOATS[S.boat];
  const fs=f.s.str*(.6+.5*f.wt/f.s.max)*(.45+.55*g.stamina),ratio=fs/r.str;
  if(!f.chest){g.surgeT-=dt;g.surgeAge+=dt;if(g.surgeT<=0){g.surging=!g.surging;g.surgeAge=0;g.surgeT=g.surging?rnd(f.boss?.6:.4,f.boss?1.1:.9):rnd(.8,f.boss?2:2.4);if(g.surging&&f.boss)g.shake=.5}}
  const hit=g.surging&&(!f.boss||g.surgeAge>.3);
  if(held){g.p+=(.21+.03*S.rod)*boat.reel*(f.boss?.5:1)*dt;g.tension+=(.4*ratio+(hit?(f.boss?1.6:1.1)*ratio:0))*dt}
  else{g.tension-=.8*dt;g.p-=.05*ratio*dt*(hit?2.5:1)}
  g.stamina=Math.max(0,g.stamina-(f.boss?.03:.05)*dt);g.tension=Math.max(0,g.tension);
  if(g.tension>=1)endFight(f.chest?'Snap! The chest sank.':f.boss?'SNAP! The boss broke free!':'Snap! The line broke.');
  else if(g.p<=0)endFight(f.boss?'The boss escaped into the deep…':'It got away…');
  else if(g.p>=1)land();
  else{const s=g.start,jx=hit?rnd(-6,6):0;L.x=s.x+(275-s.x)*g.p+jx+Math.sin(t*9)*3;L.y=s.y+(SURF+8-s.y)*g.p+(hit?rnd(-4,4):0);
   if(f.chest){f.x=L.x;f.y=L.y+12}else{f.x=Math.min(W-40,L.x+f.len*(f.boss?.38:.45));f.y=L.y+2;f.dir=-1}}}
 for(const f of g.fish){if(f.hooked||f===g.target)continue;
  if(f.chest){f.life-=dt;f.x+=Math.sin(t*.5+f.ph)*6*dt;f.y+=Math.sin(t*1.3+f.ph)*4*dt;continue}
  if(f.boss&&!f.flee){f.x+=f.dir*f.sp*dt;if(f.x<340)f.dir=1;if(f.x>W-130)f.dir=-1;f.y+=(440+Math.sin(t*.5)*60-f.y)*dt;continue}
  f.x+=f.dir*f.sp*(f.flee?3.2:1)*dt;f.y+=Math.sin(t*.8+f.ph)*8*dt;if(!f.boss)f.y=Math.max(f.s.y[0],Math.min(Math.min(f.s.y[1],BOT-14),f.y));

requestAnimationFrame(loop);

/* UI */
const fsvg=(s,known)=>{const ry=Math.min(20,s.h*75),c=known?s.c:'currentColor';return `<svg viewBox="0 0 100 50" aria-hidden="true"><path d="M20 25 L3 ${25-ry*1.1} L8 25 L3 ${25+ry*1.1}Z" fill="${known?s.d:c}"/><ellipse cx="55" cy="25" rx="40" ry="${ry}" fill="${c}"/>${known?`<ellipse cx="57" cy="${25+ry*.45}" rx="32" ry="${ry*.5}" fill="${s.b}" opacity=".8"/><circle cx="81" cy="${25-ry*.25}" r="3.4" fill="#fff"/><circle cx="82" cy="${25-ry*.25}" r="1.9" fill="#111"/>`:''}</svg>`};
const bossSVG=(s,known)=>{const c=known?s.c:'currentColor',d=known?s.d:'currentColor';return s.kind==='squid'
 ?`<svg viewBox="0 0 100 50" aria-hidden="true"><g stroke="${d}" stroke-width="4" stroke-linecap="round" fill="none"><path d="M40 20 q-15 -12 -34 -8"/><path d="M40 25 q-18 0 -36 4"/><path d="M40 30 q-16 10 -34 14"/><path d="M42 33 q-10 12 -22 16"/></g><ellipse cx="62" cy="25" rx="30" ry="15" fill="${c}"/><path d="M88 17 L98 25 L88 33Z" fill="${d}"/>${known?'<circle cx="52" cy="21" r="5" fill="#ffd84a"/><ellipse cx="52" cy="21" rx="1.5" ry="3.5" fill="#111"/>':''}</svg>`
 :`<svg viewBox="0 0 100 50" aria-hidden="true"><path d="M6 30 q12 -18 24 0 t24 0 t20 -4" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"/><ellipse cx="80" cy="25" rx="12" ry="8" fill="${c}"/><path d="M76 19 L68 9 L82 18Z" fill="${d}"/>${known?'<circle cx="84" cy="23" r="2.5" fill="#fff6a0"/><path d="M91 27 L99 29 L91 31Z" fill="#ffd24a"/>':''}</svg>`};
const chestSVG=()=>`<svg viewBox="0 0 100 60" aria-hidden="true"><rect x="22" y="24" width="56" height="30" rx="4" fill="#8a5a2b"/><path d="M22 26 Q50 2 78 26Z" fill="#a8703a"/><rect x="22" y="30" width="56" height="5" fill="#f2c14e"/><rect x="45" y="28" width="10" height="12" rx="2" fill="#f2c14e"/><path d="M84 8 v12 M78 14 h12" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/></svg>`;
function showCard(html){cardOpen=true;held=false;$('#cbox').innerHTML=html+'<button id="ok">Awesome!</button>';$('#card').classList.add('on');$('#ok').focus()}
$('#card').addEventListener('click',e=>{if(e.target.id==='ok'||e.target.id==='card'){$('#card').classList.remove('on');cardOpen=false;last=performance.now()}});
function row(item,i,owned,active,kind,desc){const btn=active?'<button disabled>Using</button>':owned?`<button class="ghost" data-k="${kind}" data-i="${i}">Use</button>`:`<button data-k="${kind}" data-i="${i}" ${S.coins<item.cost?'disabled':''}>Buy ${fmt(item.cost)}</button>`;
 return `<div class="row"><div>${item.name}<small>${desc}</small></div>${btn}</div>`}
function goArea(a){if(a===S.area)return;if(a==='lava'&&!S.ownO.includes(2))return;if(a==='lava')S.boat=2;S.area=a;resetArea();save();renderUI();say(AREAS[a],2)}
function renderUI(){$('#coins').textContent=fmt(S.coins);$('#cnum').textContent=S.cooler.length;
 const cv2=S.cooler.reduce((a,c)=>a+c.val,0);const sb=$('#sell');sb.textContent=cv2?`Sell for ${fmt(cv2)}`:'Sell';sb.disabled=!cv2;
 const lavaOk=S.ownO.includes(2);
 $('#areas').innerHTML=Object.keys(AREAS).map(a=>`<button data-a="${a}" class="${S.area===a?'on ':''}${a}" ${a==='lava'&&!lavaOk?'disabled':''} aria-pressed="${S.area===a}">${AREAS[a]}${a==='lava'&&!lavaOk?' (needs Lava Barge)':''}</button>`).join('');
 $('#boats').innerHTML=BOATS.map((b,i)=>row(b,i,S.ownO.includes(i),S.boat===i,'o',b.txt)).join('');
 $('#rods').innerHTML=RODS.map((r,i)=>row(r,i,S.ownR.includes(i),S.rod===i,'r',`Strength ${r.str}× · depth ${Math.round((r.depth-SURF)/37)} m`)).join('');
 $('#baits').innerHTML=BAITS.map((b,i)=>row(b,i,S.ownB.includes(i),S.bait===i,'b',b.txt)).join('');
 $('#gear').innerHTML=GEAR.map((it,i)=>`<div class="row"><div>${it.name}<small>${it.txt}</small></div>${has(it.id)?'<button disabled>Owned</button>':`<button data-k="g" data-i="${i}" ${S.coins<it.cost?'disabled':''}>Buy ${fmt(it.cost)}</button>`}</div>`).join('');
 const n=Object.keys(S.journal).length;$('#jcount').textContent=`${n} of ${SP.length} species caught · ${Object.keys(S.trophies).length} of 2 bosses beaten`;
 const card=s=>{const j=S.journal[s.id];return `<div>${fsvg(s,!!j)}${j?s.name:'???'}<small>${j?`Best ${j.best} kg · ×${j.n}`:'Not caught yet'}</small></div>`};
 $('#journal').innerHTML=Object.keys(AREAS).map(a=>`<h5>${AREAS[a]}</h5>`+SP.filter(s=>s.a===a).map(card).join('')).join('')+'<h5>Bosses</h5>'+Object.values(BOSS).map(B=>{const n=S.trophies[B.id];return `<div>${bossSVG(B,!!n)}${n?B.name:'???'}<small>${n?`Beaten ×${n}`:'Not beaten yet'}</small></div>`}).join('');
 lastBoss=''}
document.addEventListener('click',e=>{const a=e.target.closest('button[data-a]');if(a){goArea(a.dataset.a);return}
 const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k,i=+b.dataset.i;
 if(k==='g'){const it=GEAR[i];if(has(it.id)||S.coins<it.cost)return;S.coins-=it.cost;S.gear.push(it.id)}
 else{const list={r:RODS,b:BAITS,o:BOATS}[k],own={r:S.ownR,b:S.ownB,o:S.ownO}[k];
  if(!own.includes(i)){if(S.coins<list[i].cost)return;S.coins-=list[i].cost;own.push(i)}
  if(k==='r')S.rod=i;else if(k==='b')S.bait=i;else{S.boat=i;if(S.area==='lava'&&i!==2){S.area='lake';resetArea();say('Too hot for that boat! Back to Sunset Lake.',2.6)}}}
 save();renderUI()});
$('#sell').addEventListener('click',()=>{const v=S.cooler.reduce((a,c)=>a+c.val,0);if(!v)return;S.coins+=v;S.cooler=[];save();renderUI();say(`Sold for ${fmt(v)} coins!`)});
let armed=0;$('#reset').addEventListener('click',e=>{if(Date.now()-armed<3000){S=fresh();save();resetArea();renderUI();e.target.textContent='Start over';armed=0;say('Fresh start!')}else{armed=Date.now();e.target.textContent='Tap again to wipe progress';setTimeout(()=>{e.target.textContent='Start over'},3000)}});
renderUI();
}
</script>
</body></html>
